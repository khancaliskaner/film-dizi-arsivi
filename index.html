<!DOCTYPE html>
<!-- Uygulamanın tek sayfası: üst menü, kart ızgarası ve ekleme/düzenleme formu burada. -->
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAAN'IN NİŞ SEÇİMLERİ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#ana" class="logo">KAAN'IN NİŞ SEÇİMLERİ</a>
      <nav class="nav">
        <a href="#ana" data-page="ana">Ana Sayfa</a>
        <a href="#arsiv" data-page="arsiv">Arşiv</a>
        <a href="#izlediklerim" data-page="izlediklerim">İzlediklerim</a>
        <a href="#liste" data-page="liste">İzleme Listem</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-icon" id="settings-btn" aria-label="Ayarlar" title="Ayarlar">⚙</button>
        <button class="btn btn-primary" id="add-btn">+ Ekle</button>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title" id="page-title"></h1>
    <p class="page-subtitle" id="page-subtitle"></p>

    <!-- Arama, filtre ve sıralama çubuğu -->
    <div class="toolbar" id="toolbar" hidden>
      <input type="search" id="search" placeholder="İsme göre ara…" aria-label="İsme göre ara" autocomplete="off">
      <div class="filters">
        <select id="filter-type" aria-label="Tür">
          <option value="">Film ve dizi</option>
          <option value="film">Sadece film</option>
          <option value="dizi">Sadece dizi</option>
        </select>
        <select id="filter-status" aria-label="Durum">
          <option value="">Tüm durumlar</option>
          <option value="izledim">İzledim</option>
          <option value="izlenecek">İzlemek istiyorum</option>
        </select>
        <select id="filter-rating" aria-label="Puan">
          <option value="">Tüm puanlar</option>
          <option value="5">★★★★★</option>
          <option value="4">★★★★ ve üstü</option>
          <option value="3">★★★ ve üstü</option>
          <option value="2">★★ ve üstü</option>
          <option value="1">★ ve üstü</option>
          <option value="none">Puansız</option>
        </select>
        <select id="filter-year" aria-label="Yıl">
          <option value="">Tüm yıllar</option>
        </select>
        <select id="sort" aria-label="Sıralama">
          <option value="date">En yeni izlenen</option>
          <option value="rating">En yüksek puan</option>
          <option value="title">Alfabetik (A-Z)</option>
        </select>
        <button type="button" class="btn btn-small" id="clear-filters" hidden>Filtreleri temizle</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden></p>
  </main>

  <!-- Ekleme / düzenleme formu (açılır pencere) -->
  <dialog id="form-dialog">
    <form id="entry-form" class="dialog-form" novalidate>
      <h2 id="form-title">Yeni Kayıt</h2>

      <label>Başlık *
        <input type="text" name="title" required maxlength="150" autocomplete="off"
               placeholder="Film veya dizi adı yaz…">
      </label>

      <!-- TMDB arama sonuçları ve durum mesajı -->
      <p class="hint" id="tmdb-hint" hidden></p>
      <ul class="tmdb-results" id="tmdb-results" hidden></ul>

      <!-- TMDB'den seçilen yapımın önizlemesi -->
      <div class="tmdb-preview" id="tmdb-preview" hidden>
        <img id="preview-poster" alt="">
        <div class="preview-info">
          <p class="preview-genres" id="preview-genres"></p>
          <p class="preview-overview" id="preview-overview"></p>
          <button type="button" class="btn btn-small" id="unlink-tmdb">TMDB bağlantısını kaldır</button>
        </div>
      </div>

      <div class="row">
        <fieldset class="toggle">
          <legend>Tür</legend>
          <label><input type="radio" name="type" value="film" checked> Film</label>
          <label><input type="radio" name="type" value="dizi"> Dizi</label>
        </fieldset>
        <label class="year-field">Yıl
          <input type="number" name="year" min="1870" max="2100" inputmode="numeric">
        </label>
      </div>

      <fieldset class="toggle">
        <legend>Durum</legend>
        <label><input type="radio" name="status" value="izledim" checked> İzledim</label>
        <label><input type="radio" name="status" value="izlenecek"> İzlemek istiyorum</label>
      </fieldset>

      <div id="watched-fields">
        <div class="field">
          <span class="field-label">Puan <span id="rating-text" class="muted"></span></span>
          <div class="star-row">
            <div class="star-input" id="star-input" tabindex="0" role="slider"
                 aria-label="Puan" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
              <span class="stars-bg">★★★★★</span>
              <span class="stars-fill" id="stars-fill">★★★★★</span>
            </div>
            <button type="button" class="btn btn-small" id="clear-rating">Temizle</button>
          </div>
        </div>

        <label>İzleme tarihi
          <input type="date" name="watchedDate">
        </label>
      </div>

      <label>Kısa yorum
        <textarea name="review" rows="3" maxlength="1000"></textarea>
      </label>

      <p class="form-error" id="form-error" hidden></p>

      <div class="form-actions">
        <button type="button" class="btn" id="cancel-btn">Vazgeç</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>
  </dialog>

  <!-- Ayarlar penceresi: TMDB anahtarı -->
  <dialog id="settings-dialog">
    <form id="settings-form" class="dialog-form">
      <h2>Ayarlar</h2>
      <label>TMDB API anahtarı
        <input type="text" id="tmdb-key" autocomplete="off" spellcheck="false"
               placeholder="32 karakterlik anahtar (API Key)">
      </label>
      <p class="hint">Anahtar sadece bu tarayıcıda saklanır, GitHub'a gitmez. Afiş ve bilgileri otomatik getirmek için gerekir.</p>
      <p class="hint" id="settings-status" hidden></p>
      <div class="form-actions">
        <button type="button" class="btn" id="settings-close">Kapat</button>
        <button type="submit" class="btn btn-primary">Kaydet ve dene</button>
      </div>
    </form>
  </dialog>

  <!-- config.js: TMDB anahtarının durduğu ayar dosyası (GitHub'da yok; yoksa sorun değil) -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
